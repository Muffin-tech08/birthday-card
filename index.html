<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.0/dist/confetti.browser.min.js"></script>
<style>

  /* =====================================================================
     🎂 FLAMES TUNING PANEL
     Adjust these two values to line the candle flames up with the ones
     drawn on your cake.png artwork. Nothing else needs to change.

     --candle-bottom : distance from the BOTTOM of the screen up to where
                        the row of flames sits. Increase to move the row
                        UP, decrease to move it DOWN.
     --candle-gap     : horizontal spacing BETWEEN each flame. Increase to
                        spread the candles further apart, decrease to
                        bunch them closer together.
     ===================================================================== */
  :root{
    --candle-bottom: 42%;   /* ↕ vertical position of the flame row  */
    --candle-gap:    18px;  /* ↔ spacing between candles             */

    /* secondary tuning knobs (optional) */
    --candle-width:  9px;   /* thickness of each candle stick        */
    --candle-height: 30px;  /* height of each candle stick           */
    --flame-width:   15px;  /* width of each flame                   */
    --flame-height:  24px;  /* height of each flame                  */
  }
  /* =================== END FLAMES TUNING PANEL ======================= */

  :root{
    --flame-core:#fff2b0;
    --flame-mid:#ffb648;
    --flame-out:#ff7a3d;
    --ink:#3a2415;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    background:#1a1210;
    font-family:'Baloo 2', sans-serif;
    touch-action:manipulation;
    position:fixed;
    inset:0;
  }

  #phone{
    position:fixed;
    inset:0;
    width:100%;
    height:100dvh;
    overflow:hidden;
    background:#1a1210;
  }

  .page{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
  }

  .page > img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    -webkit-user-drag:none;
    user-select:none;
    pointer-events:none;
  }

  /* ---------- STAGE LAYERING (top level) ---------- */
  #cakePage{ z-index:1; }
  #envelopeGroup{ z-index:2; }
  #coverPage{ z-index:3; }

  /* ---------- PHASE 1: 3D GATEFOLD COVER ---------- */
  #coverPage{
    perspective: 1400px;
    cursor:pointer;
    background:#1a1210;
  }
  #coverPage .hint{
    position:absolute;
    left:50%;
    bottom:6.5%;
    transform:translateX(-50%);
    color:#fff;
    font-size:13px;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-weight:700;
    opacity:.85;
    text-shadow:0 1px 6px rgba(0,0,0,.4);
    animation: pulseHint 1.8s ease-in-out infinite;
    pointer-events:none;
    z-index:5;
  }
  @keyframes pulseHint{
    0%,100%{ opacity:.55; transform:translateX(-50%) translateY(0); }
    50%{ opacity:1; transform:translateX(-50%) translateY(-4px); }
  }

  .door{
    position:absolute;
    top:0;
    width:50%;
    height:100%;
    background-image:url('cover.png');
    background-repeat:no-repeat;
    background-size:200% 100%;
    transform-style:preserve-3d;
    backface-visibility:hidden;
    transition: transform .95s cubic-bezier(.6,0,.3,1), opacity .95s cubic-bezier(.6,0,.3,1), box-shadow .95s ease;
    box-shadow: 0 0 30px rgba(0,0,0,.35) inset;
  }
  .door-left{
    left:0;
    background-position:left center;
    transform-origin:left center;
    z-index:2;
  }
  .door-right{
    right:0;
    background-position:right center;
    transform-origin:right center;
    z-index:1;
  }
  /* subtle center seam shading so the two halves read as one closed cover */
  .door-left::after,
  .door-right::after{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    width:14px;
    pointer-events:none;
  }
  .door-left::after{
    right:0;
    background:linear-gradient(to right, rgba(0,0,0,0), rgba(0,0,0,.25));
  }
  .door-right::after{
    left:0;
    background:linear-gradient(to left, rgba(0,0,0,0), rgba(0,0,0,.25));
  }

  #coverPage.open .door-left{
    transform: rotateY(-100deg);
    opacity:0;
    box-shadow: 20px 0 40px rgba(0,0,0,.5) inset;
  }
  #coverPage.open .door-right{
    transform: rotateY(100deg);
    opacity:0;
    box-shadow: -20px 0 40px rgba(0,0,0,.5) inset;
  }
  #coverPage.hidden{
    visibility:hidden;
    pointer-events:none;
  }

  /* ---------- ENVELOPE GROUP (3-layer stack) ---------- */
  #envelopeGroup{
    cursor:pointer;
    transition: opacity .55s ease;
  }
  #envelopeGroup.fading{
    opacity:0;
    pointer-events:none;
  }

  .envelope-stack{
    position:absolute;
    inset:0;
  }

  /* Layer 1 (back): the envelope itself, sitting behind everything */
  .envelope-back{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
    pointer-events:none;
    -webkit-user-drag:none;
    user-select:none;
  }

  /* Layer 2 (middle): the letter, tucked down/small inside the pocket */
  .letter-slide{
    position:absolute;
    inset:0;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#c7a878;
    border-radius:4px;
    transform: translateY(35%) scale(0.85);
    transform-origin:50% 100%;
    transition: transform .85s cubic-bezier(.33,1.05,.4,1), box-shadow .6s ease;
    box-shadow:0 -8px 20px rgba(0,0,0,.25) inset;
  }
  .letter-slide.extracted{
    z-index:4; /* rises above the front envelope lip */
    transform: translateY(0) scale(1);
    box-shadow:none;
  }
  .letter-slide.closing{
    transform: translateY(120%) scale(.92);
  }
  .letter-slide img{
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
    -webkit-user-drag:none;
    user-select:none;
  }

  /* Layer 3 (front): a second copy of the envelope, on top of the
     tucked letter, so the letter looks like it's hidden inside it */
  .envelope-front{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:3;
    pointer-events:none;
    -webkit-user-drag:none;
    user-select:none;
  }

  #envelopeGroup .hint{
    position:absolute;
    left:50%;
    bottom:6.5%;
    transform:translateX(-50%);
    color:var(--ink);
    background:rgba(255,255,255,.72);
    padding:8px 16px;
    border-radius:999px;
    font-size:13px;
    letter-spacing:.06em;
    font-weight:700;
    box-shadow:0 4px 14px rgba(0,0,0,.15);
    z-index:5;
    pointer-events:none;
    opacity:0;
    animation: floatHint 2s ease-in-out infinite;
    transition:opacity .4s ease .35s;
  }
  #envelopeGroup.show-hint .hint{ opacity:1; }
  #envelopeGroup.hide-hint .hint{ opacity:0; transition:opacity .2s ease; }

  .letter-hint{
    position:absolute;
    left:50%;
    bottom:4%;
    transform:translateX(-50%);
    color:var(--ink);
    background:rgba(255,255,255,.75);
    padding:7px 15px;
    border-radius:999px;
    font-size:12px;
    letter-spacing:.06em;
    font-weight:700;
    box-shadow:0 4px 14px rgba(0,0,0,.15);
    z-index:5;
    opacity:0;
    pointer-events:none;
    transition:opacity .5s ease .9s;
  }
  .letter-slide.extracted ~ .letter-hint{ opacity:1; }

  @keyframes floatHint{
    0%,100%{ transform:translateX(-50%) translateY(0); }
    50%{ transform:translateX(-50%) translateY(-6px); }
  }

  /* ---------- CAKE ---------- */
  #cakePage{ }

  .candles-row{
    position:absolute;
    left:50%;
    bottom: var(--candle-bottom);
    transform:translateX(-50%);
    display:flex;
    align-items:flex-end;
    gap: var(--candle-gap);
    z-index:2;
  }

  .candle{
    position:relative;
    width: var(--candle-width);
    height: var(--candle-height);
    background: repeating-linear-gradient(
      45deg,
      #ff8fb0 0 6px,
      #ffffff 6px 12px
    );
    border-radius:2px;
    box-shadow:0 1px 2px rgba(0,0,0,.25);
    flex-shrink:0;
  }
  .flame{
    position:absolute;
    left:50%;
    bottom:100%;
    width: var(--flame-width);
    height: var(--flame-height);
    transform:translateX(-50%);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    background:radial-gradient(circle at 50% 70%, var(--flame-core) 0%, var(--flame-mid) 55%, var(--flame-out) 85%, rgba(255,122,61,0) 100%);
    box-shadow:0 0 12px 4px rgba(255,170,60,.55), 0 0 22px 10px rgba(255,120,40,.25);
    animation: flicker 1.1s ease-in-out infinite;
    transform-origin:50% 100%;
    transition:opacity .4s ease, transform .4s ease;
  }
  .candle:nth-child(odd) .flame{ animation-duration:1.3s; }
  .flame::after{
    content:"";
    position:absolute;
    left:50%; bottom:8%;
    width:6px; height:10px;
    transform:translateX(-50%);
    background:radial-gradient(circle, #3b73ff 0%, rgba(59,115,255,0) 70%);
    opacity:.7;
    border-radius:50%;
  }
  @keyframes flicker{
    0%,100%{ transform:translateX(-50%) rotate(-3deg) scaleY(1); }
    25%{ transform:translateX(-50%) rotate(2deg) scaleY(1.07); }
    50%{ transform:translateX(-50%) rotate(-2deg) scaleY(.94); }
    75%{ transform:translateX(-50%) rotate(3deg) scaleY(1.03); }
  }
  .candle.out .flame{
    opacity:0;
    transform:translateX(-50%) scaleY(.2);
    animation:none;
    box-shadow:none;
  }
  .smoke{
    position:absolute;
    left:50%;
    bottom:100%;
    width:6px;
    height:6px;
    transform:translateX(-50%);
    background:rgba(200,200,200,.55);
    border-radius:50%;
    filter:blur(2px);
    opacity:0;
  }
  .candle.out .smoke{
    animation: smokeRise 1.1s ease-out forwards;
  }
  @keyframes smokeRise{
    0%{ opacity:.6; transform:translate(-50%,0) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-46px) scale(2.6); }
  }

  #micStatus{
    position:absolute;
    top:calc(env(safe-area-inset-top, 0px) + 16px);
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.4);
    color:#fff;
    font-size:12px;
    font-weight:700;
    letter-spacing:.04em;
    padding:7px 14px;
    border-radius:999px;
    backdrop-filter:blur(6px);
    opacity:0;
    transition:opacity .4s ease;
    pointer-events:none;
    text-align:center;
    max-width:80%;
    z-index:6;
  }
  #micStatus.show{ opacity:1; }

  #banner{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.4);
    z-index:10;
    opacity:0;
    pointer-events:none;
    text-align:center;
    transition:opacity .45s ease, transform .55s cubic-bezier(.2,1.4,.4,1);
  }
  #banner.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
  #banner h1{
    margin:0;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(32px, 10.5vw, 50px);
    color:#fff;
    letter-spacing:.02em;
    text-shadow:
      0 2px 0 #d94f70,
      0 4px 0 #c83e60,
      0 10px 22px rgba(0,0,0,.45);
    -webkit-text-stroke:1.5px #a72e4d;
    line-height:1.05;
  }
  #banner .sub{
    margin-top:8px;
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:clamp(20px, 6vw, 26px);
    color:#fff8ef;
    text-shadow:0 2px 10px rgba(0,0,0,.4);
  }

  #tapCakeHint{
    position:absolute;
    left:50%;
    bottom:4%;
    transform:translateX(-50%);
    color:var(--ink);
    background:rgba(255,255,255,.78);
    padding:8px 16px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
    letter-spacing:.04em;
    box-shadow:0 4px 14px rgba(0,0,0,.15);
    opacity:0;
    transition:opacity .4s ease;
    pointer-events:none;
    text-align:center;
    max-width:78%;
    z-index:6;
  }
  #tapCakeHint.show{ opacity:1; animation: floatHint 2s ease-in-out infinite; }

  #confettiCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:20;
    pointer-events:none;
  }

  @media (prefers-reduced-motion: reduce){
    .door, .letter-slide, .flame, #banner, #envelopeGroup{
      transition-duration:.01ms !important;
      animation-duration:.01ms !important;
    }
  }
</style>
</head>
<body>

<div id="phone">

  <!-- STAGE 3: CAKE -->
  <div class="page" id="cakePage">
    <img id="cakeImg" src="cake.png" alt="Birthday cake" draggable="false">

    <div class="candles-row" id="candlesRow">
      <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
      <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
      <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
      <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
      <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
    </div>

    <div id="micStatus">Listening for a candle blow… 🎤</div>
    <div id="tapCakeHint">Tap the cake to blow out the candles</div>

    <div id="banner">
      <h1>HAPPY BIRTHDAY!</h1>
      <div class="sub">make a wish 🎉</div>
    </div>
  </div>

  <!-- STAGE 2: ENVELOPE GROUP (3-layer stack: back envelope / letter / front envelope) -->
  <div class="page" id="envelopeGroup">
    <div class="envelope-stack">
      <img class="envelope-back" src="envelope.png" alt="" draggable="false">

      <div class="letter-slide" id="letterSlide">
        <img src="letter.png" alt="Birthday letter" draggable="false">
      </div>

      <img class="envelope-front" src="envelope.png" alt="Envelope with letter peeking out" draggable="false">

      <div class="letter-hint">Tap to continue</div>
    </div>
    <div class="hint">Tap to open the letter</div>
  </div>

  <!-- STAGE 1: 3D GATEFOLD COVER -->
  <div class="page" id="coverPage">
    <div class="door door-left"></div>
    <div class="door door-right"></div>
    <div class="hint">Tap to open</div>
  </div>

</div>

<canvas id="confettiCanvas"></canvas>

<script>
(function(){
  "use strict";

  var coverPage      = document.getElementById('coverPage');
  var doorLeft       = coverPage.querySelector('.door-left');
  var doorRight       = coverPage.querySelector('.door-right');
  var envelopeGroup   = document.getElementById('envelopeGroup');
  var letterSlide     = document.getElementById('letterSlide');
  var cakePage        = document.getElementById('cakePage');
  var micStatus       = document.getElementById('micStatus');
  var tapCakeHint      = document.getElementById('tapCakeHint');
  var banner           = document.getElementById('banner');
  var confettiCanvas    = document.getElementById('confettiCanvas');

  var myConfetti = confetti.create(confettiCanvas, { resize: true, useWorker: true });

  var stage = 1;              // 1 cover, 2 envelope, 3 letter open, 4 cake
  var letterState = 'tucked'; // tucked -> extracted -> gone

  /* ---------------- PHASE 1: 3D GATEFOLD COVER ---------------- */
  coverPage.addEventListener('click', function(){
    if (stage !== 1) return;
    stage = 2;
    coverPage.classList.add('open');
    envelopeGroup.classList.add('show-hint');
    doorLeft.addEventListener('transitionend', function handler(e){
      if (e.propertyName !== 'transform') return;
      coverPage.classList.add('hidden');
      doorLeft.removeEventListener('transitionend', handler);
    });
  });

  /* ---------------- PHASE 2: ENVELOPE -> LETTER EXTRACTED ---------------- */
  envelopeGroup.addEventListener('click', function(){
    if (stage === 2 && letterState === 'tucked'){
      letterState = 'extracting';
      envelopeGroup.classList.remove('show-hint');
      envelopeGroup.classList.add('hide-hint');
      letterSlide.classList.add('extracted');
      letterSlide.addEventListener('transitionend', function handler(e){
        if (e.propertyName !== 'transform' || letterState !== 'extracting') return;
        letterState = 'extracted';
        stage = 3;
        letterSlide.removeEventListener('transitionend', handler);
      });
      return;
    }

    /* ---------------- PHASE 3: LETTER -> CAKE ---------------- */
    if (stage === 3 && letterState === 'extracted'){
      letterState = 'closing';
      stage = 4;
      letterSlide.classList.add('closing');
      envelopeGroup.classList.add('fading');
      letterSlide.addEventListener('transitionend', function handler(e){
        if (e.propertyName !== 'transform') return;
        envelopeGroup.style.visibility = 'hidden';
        envelopeGroup.style.pointerEvents = 'none';
        letterSlide.removeEventListener('transitionend', handler);
        initCakeStage();
      });
    }
  });

  /* ---------------- PHASE 4: CAKE + CANDLES ---------------- */
  var candles = Array.prototype.slice.call(document.querySelectorAll('#candlesRow .candle'));
  var candlesLit = candles.length;
  var extinguishing = false;
  var audioCtx, analyser, dataArray, rafId;
  var cakeInited = false;

  function initCakeStage(){
    if (cakeInited) return;
    cakeInited = true;
    setupMic();
  }

  function setupMic(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      enableTapFallback('Microphone not supported — tap the cake to blow out the candles');
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function(stream){
        micStatus.classList.add('show');
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = 0.75;
        source.connect(analyser);
        dataArray = new Uint8Array(analyser.fftSize);
        listenForBlow();
      })
      .catch(function(){
        enableTapFallback('Mic access denied — tap the cake to blow out the candles');
      });
  }

  function enableTapFallback(message){
    tapCakeHint.textContent = message;
    tapCakeHint.classList.add('show');
    cakePage.style.cursor = 'pointer';
    cakePage.addEventListener('click', onCakeTap);
  }

  function onCakeTap(){
    if (extinguishing || candlesLit === 0) return;
    extinguishOne();
  }

  var blowHold = 0;
  function listenForBlow(){
    rafId = requestAnimationFrame(listenForBlow);
    if (!analyser) return;
    analyser.getByteTimeDomainData(dataArray);
    var sum = 0;
    for (var i = 0; i < dataArray.length; i++){
      var v = (dataArray[i] - 128) / 128;
      sum += v * v;
    }
    var rms = Math.sqrt(sum / dataArray.length);

    if (rms > 0.16){
      blowHold++;
    } else {
      blowHold = Math.max(0, blowHold - 1);
    }

    if (blowHold > 4 && candlesLit > 0 && !extinguishing){
      blowHold = 0;
      extinguishOne();
    }
  }

  function extinguishOne(){
    if (candlesLit <= 0) return;
    extinguishing = true;
    var idx = candles.length - candlesLit;
    candles[idx].classList.add('out');
    candlesLit--;
    if (candlesLit === 0){
      cleanupMic();
      setTimeout(celebrate, 550);
    } else {
      setTimeout(function(){ extinguishing = false; }, 260);
    }
  }

  function cleanupMic(){
    if (rafId) cancelAnimationFrame(rafId);
    micStatus.classList.remove('show');
    tapCakeHint.classList.remove('show');
    cakePage.removeEventListener('click', onCakeTap);
    if (audioCtx && audioCtx.state !== 'closed'){
      try { audioCtx.close(); } catch(e){}
    }
  }

  function celebrate(){
    banner.classList.add('show');
    fireConfettiBurst();
  }

  function fireConfettiBurst(){
    var duration = 3200;
    var end = Date.now() + duration;
    var colors = ['#ff6b8b', '#ffd166', '#4dd4ac', '#5fa8ff', '#c98bff', '#ffffff'];

    myConfetti({
      particleCount: 160,
      spread: 110,
      origin: { y: 0.3 },
      colors: colors,
      startVelocity: 58,
      scalar: 1.15
    });

    (function frame(){
      myConfetti({
        particleCount: 7,
        angle: 60,
        spread: 65,
        origin: { x: 0, y: 0.5 },
        colors: colors
      });
      myConfetti({
        particleCount: 7,
        angle: 120,
        spread: 65,
        origin: { x: 1, y: 0.5 },
        colors: colors
      });
      if (Date.now() < end){
        requestAnimationFrame(frame);
      }
    })();

    setTimeout(function(){
      myConfetti({
        particleCount: 100,
        spread: 140,
        origin: { y: 0.2 },
        colors: colors,
        startVelocity: 48,
        scalar: 1.05
      });
    }, 500);
  }

})();
</script>

</body>
</html>
