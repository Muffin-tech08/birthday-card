<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.0/dist/confetti.browser.min.js"></script>
<style>
  :root{
    --flame-core:#fff2b0;
    --flame-mid:#ffb648;
    --flame-out:#ff7a3d;
    --paper:#fbead9;
    --ink:#3a2415;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    background:#1a1210;
    font-family:'Baloo 2', sans-serif;
    touch-action:manipulation;
    position:fixed;
    inset:0;
  }

  #phone{
    position:fixed;
    inset:0;
    width:100%;
    height:100dvh;
    overflow:hidden;
    background:#1a1210;
  }

  .page{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
  }

  .page img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    -webkit-user-drag:none;
    user-select:none;
    pointer-events:none;
  }

  /* ---------- STAGE LAYERING ---------- */
  #cakePage{ z-index:1; }
  #envelopePage{ z-index:2; }
  #letterOverlay{ z-index:3; }
  #coverPage{ z-index:4; }

  /* ---------- COVER ---------- */
  #coverPage{
    transition: transform .68s cubic-bezier(.62,0,.35,1), box-shadow .68s ease;
    box-shadow: 6px 0 24px rgba(0,0,0,.35);
    cursor:pointer;
  }
  #coverPage.slide-away{
    transform: translateX(-112%) rotate(-2deg);
    box-shadow: 20px 0 40px rgba(0,0,0,.5);
  }
  #coverPage .hint{
    position:absolute;
    left:50%;
    bottom:6.5%;
    transform:translateX(-50%);
    color:#fff;
    font-size:13px;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-weight:700;
    opacity:.85;
    text-shadow:0 1px 6px rgba(0,0,0,.4);
    animation: pulseHint 1.8s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes pulseHint{
    0%,100%{ opacity:.55; transform:translateX(-50%) translateY(0); }
    50%{ opacity:1; transform:translateX(-50%) translateY(-4px); }
  }

  /* ---------- ENVELOPE ---------- */
  #envelopePage{
    cursor:pointer;
  }
  #envelopePage .hint{
    position:absolute;
    left:50%;
    bottom:6.5%;
    transform:translateX(-50%);
    color:var(--ink);
    background:rgba(255,255,255,.72);
    padding:8px 16px;
    border-radius:999px;
    font-size:13px;
    letter-spacing:.06em;
    font-weight:700;
    box-shadow:0 4px 14px rgba(0,0,0,.15);
    animation: floatHint 2s ease-in-out infinite;
    pointer-events:none;
    opacity:0;
    transition:opacity .4s ease .5s;
  }
  #envelopePage.show-hint .hint{ opacity:1; }
  @keyframes floatHint{
    0%,100%{ transform:translateX(-50%) translateY(0); }
    50%{ transform:translateX(-50%) translateY(-6px); }
  }

  /* ---------- LETTER ---------- */
  #letterOverlay{
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    opacity:0;
  }
  #letterOverlay .letter-inner{
    position:absolute;
    left:50%;
    top:64%;
    width:58%;
    height:34%;
    transform:translate(-50%,-50%) scale(.72);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    transition:
      top .78s cubic-bezier(.34,1.1,.4,1),
      width .78s cubic-bezier(.34,1.1,.4,1),
      height .78s cubic-bezier(.34,1.1,.4,1),
      transform .78s cubic-bezier(.34,1.1,.4,1),
      border-radius .5s ease,
      box-shadow .6s ease;
  }
  #letterOverlay.open{
    opacity:1;
    pointer-events:auto;
    cursor:pointer;
  }
  #letterOverlay.open .letter-inner{
    top:50%;
    width:100%;
    height:100%;
    transform:translate(-50%,-50%) scale(1);
    border-radius:0;
    box-shadow:none;
  }
  #letterOverlay.closing .letter-inner{
    top:130%;
    transform:translate(-50%,-50%) scale(.94);
    opacity:0;
  }
  #letterOverlay.closing{
    transition:opacity .55s ease .15s;
    opacity:0;
  }
  #letterOverlay .letter-inner img{
    width:100%;
    height:100%;
  }
  #letterOverlay .letter-hint{
    position:absolute;
    left:50%;
    bottom:4%;
    transform:translateX(-50%);
    color:var(--ink);
    background:rgba(255,255,255,.75);
    padding:7px 15px;
    border-radius:999px;
    font-size:12px;
    letter-spacing:.06em;
    font-weight:700;
    box-shadow:0 4px 14px rgba(0,0,0,.15);
    opacity:0;
    transition:opacity .5s ease 1s;
  }
  #letterOverlay.open .letter-hint{ opacity:1; }

  /* ---------- CAKE ---------- */
  #cakePage{ }

  .candle{
    position:absolute;
    width:10px;
    height:34px;
    transform:translate(-50%,-100%);
    pointer-events:none;
  }
  .flame{
    position:absolute;
    left:50%;
    bottom:100%;
    width:16px;
    height:26px;
    transform:translateX(-50%);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    background:radial-gradient(circle at 50% 70%, var(--flame-core) 0%, var(--flame-mid) 55%, var(--flame-out) 85%, rgba(255,122,61,0) 100%);
    box-shadow:0 0 12px 4px rgba(255,170,60,.55), 0 0 22px 10px rgba(255,120,40,.25);
    animation: flicker 1.1s ease-in-out infinite;
    transform-origin:50% 100%;
    transition:opacity .4s ease, transform .4s ease;
  }
  .candle:nth-child(odd) .flame{ animation-duration:1.3s; }
  .flame::after{
    content:"";
    position:absolute;
    left:50%; bottom:8%;
    width:6px; height:10px;
    transform:translateX(-50%);
    background:radial-gradient(circle, #3b73ff 0%, rgba(59,115,255,0) 70%);
    opacity:.7;
    border-radius:50%;
  }
  @keyframes flicker{
    0%,100%{ transform:translateX(-50%) rotate(-3deg) scaleY(1); }
    25%{ transform:translateX(-50%) rotate(2deg) scaleY(1.07); }
    50%{ transform:translateX(-50%) rotate(-2deg) scaleY(.94); }
    75%{ transform:translateX(-50%) rotate(3deg) scaleY(1.03); }
  }
  .candle.out .flame{
    opacity:0;
    transform:translateX(-50%) scaleY(.2);
    animation:none;
    box-shadow:none;
  }
  .smoke{
    position:absolute;
    left:50%;
    bottom:100%;
    width:6px;
    height:6px;
    transform:translateX(-50%);
    background:rgba(200,200,200,.55);
    border-radius:50%;
    filter:blur(2px);
    opacity:0;
  }
  .candle.out .smoke{
    animation: smokeRise 1.1s ease-out forwards;
  }
  @keyframes smokeRise{
    0%{ opacity:.6; transform:translate(-50%,0) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-46px) scale(2.6); }
  }

  #micStatus{
    position:absolute;
    top:calc(env(safe-area-inset-top, 0px) + 16px);
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.4);
    color:#fff;
    font-size:12px;
    font-weight:700;
    letter-spacing:.04em;
    padding:7px 14px;
    border-radius:999px;
    backdrop-filter:blur(6px);
    opacity:0;
    transition:opacity .4s ease;
    pointer-events:none;
    text-align:center;
    max-width:80%;
  }
  #micStatus.show{ opacity:1; }

  #banner{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.4);
    z-index:10;
    opacity:0;
    pointer-events:none;
    text-align:center;
    transition:opacity .45s ease, transform .55s cubic-bezier(.2,1.4,.4,1);
  }
  #banner.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
  #banner h1{
    margin:0;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(30px, 9.5vw, 46px);
    color:#fff;
    letter-spacing:.02em;
    text-shadow:
      0 2px 0 #d94f70,
      0 4px 0 #c83e60,
      0 10px 22px rgba(0,0,0,.45);
    -webkit-text-stroke:1.5px #a72e4d;
    line-height:1.05;
  }
  #banner .sub{
    margin-top:8px;
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:clamp(20px, 6vw, 26px);
    color:#fff8ef;
    text-shadow:0 2px 10px rgba(0,0,0,.4);
  }

  #tapCakeHint{
    position:absolute;
    left:50%;
    bottom:4%;
    transform:translateX(-50%);
    color:var(--ink);
    background:rgba(255,255,255,.78);
    padding:8px 16px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
    letter-spacing:.04em;
    box-shadow:0 4px 14px rgba(0,0,0,.15);
    opacity:0;
    transition:opacity .4s ease;
    pointer-events:none;
    text-align:center;
    max-width:78%;
  }
  #tapCakeHint.show{ opacity:1; animation: floatHint 2s ease-in-out infinite; }

  #confettiCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:20;
    pointer-events:none;
  }

  @media (prefers-reduced-motion: reduce){
    #coverPage, #letterOverlay, #letterOverlay .letter-inner, .flame, #banner{
      transition-duration:.01ms !important;
      animation-duration:.01ms !important;
    }
  }
</style>
</head>
<body>

<div id="phone">

  <!-- STAGE 4: CAKE -->
  <div class="page" id="cakePage">
    <img src="cake.png" alt="Birthday cake" draggable="false">
    <!-- candle flames positioned near the drawn candles at the bottom of the cake -->
    <div class="candle" id="c1" style="left:34%; top:29%;">
      <div class="flame"></div>
      <div class="smoke"></div>
    </div>
    <div class="candle" id="c2" style="left:42.5%; top:25%;">
      <div class="flame"></div>
      <div class="smoke"></div>
    </div>
    <div class="candle" id="c3" style="left:50%; top:22%;">
      <div class="flame"></div>
      <div class="smoke"></div>
    </div>
    <div class="candle" id="c4" style="left:57.5%; top:25%;">
      <div class="flame"></div>
      <div class="smoke"></div>
    </div>
    <div class="candle" id="c5" style="left:66%; top:29%;">
      <div class="flame"></div>
      <div class="smoke"></div>
    </div>

    <div id="micStatus">Listening for a candle blow… 🎤</div>
    <div id="tapCakeHint">Tap the cake to blow out the candles</div>

    <div id="banner">
      <h1>HAPPY BIRTHDAY!</h1>
      <div class="sub">make a wish 🎉</div>
    </div>
  </div>

  <!-- STAGE 2: ENVELOPE -->
  <div class="page" id="envelopePage">
    <img src="envelope.png" alt="Envelope with letter peeking out" draggable="false">
    <div class="hint">Tap to open the letter</div>
  </div>

  <!-- LETTER (animates out of envelope, then off toward cake) -->
  <div id="letterOverlay">
    <div class="letter-inner">
      <img src="letter.png" alt="Birthday letter" draggable="false">
    </div>
    <div class="letter-hint">Tap to continue</div>
  </div>

  <!-- STAGE 1: COVER -->
  <div class="page" id="coverPage">
    <img src="cover.png" alt="Birthday card cover" draggable="false">
    <div class="hint">Tap to open</div>
  </div>

</div>

<canvas id="confettiCanvas"></canvas>

<script>
(function(){
  "use strict";

  var coverPage     = document.getElementById('coverPage');
  var envelopePage  = document.getElementById('envelopePage');
  var letterOverlay = document.getElementById('letterOverlay');
  var cakePage      = document.getElementById('cakePage');
  var micStatus     = document.getElementById('micStatus');
  var tapCakeHint   = document.getElementById('tapCakeHint');
  var banner        = document.getElementById('banner');
  var confettiCanvas= document.getElementById('confettiCanvas');

  var myConfetti = confetti.create(confettiCanvas, { resize: true, useWorker: true });

  var letterState = 'closed'; // closed -> open -> gone
  var stage = 1;

  /* ---------------- PHASE 1: COVER ---------------- */
  coverPage.addEventListener('click', function(){
    if (stage !== 1) return;
    stage = 2;
    coverPage.classList.add('slide-away');
    envelopePage.classList.add('show-hint');
    coverPage.addEventListener('transitionend', function handler(e){
      if (e.propertyName !== 'transform') return;
      coverPage.style.pointerEvents = 'none';
      coverPage.style.visibility = 'hidden';
      coverPage.removeEventListener('transitionend', handler);
    });
  });

  /* ---------------- PHASE 2: ENVELOPE -> LETTER ---------------- */
  envelopePage.addEventListener('click', function(){
    if (stage !== 2 || letterState !== 'closed') return;
    letterState = 'opening';
    letterOverlay.classList.add('open');
    letterOverlay.addEventListener('transitionend', function handler(e){
      if (letterState !== 'opening') return;
      letterState = 'open';
      stage = 3;
      // envelope no longer needed underneath the fullscreen letter
      envelopePage.style.visibility = 'hidden';
      letterOverlay.removeEventListener('transitionend', handler);
    });
  });

  /* ---------------- PHASE 3: LETTER -> CAKE ---------------- */
  letterOverlay.addEventListener('click', function(){
    if (stage !== 3 || letterState !== 'open') return;
    letterState = 'closing';
    stage = 4;
    letterOverlay.classList.remove('open');
    letterOverlay.classList.add('closing');
    letterOverlay.addEventListener('transitionend', function handler(e){
      letterOverlay.style.visibility = 'hidden';
      letterOverlay.style.pointerEvents = 'none';
      letterOverlay.removeEventListener('transitionend', handler);
      initCakeStage();
    });
  });

  /* ---------------- PHASE 4: CAKE + CANDLES ---------------- */
  var candles = ['c1','c2','c3','c4','c5'].map(function(id){ return document.getElementById(id); });
  var candlesLit = candles.length;
  var extinguishing = false;
  var micActive = false;
  var audioCtx, analyser, dataArray, rafId;
  var cakeInited = false;

  function initCakeStage(){
    if (cakeInited) return;
    cakeInited = true;
    setupMic();
  }

  function setupMic(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      enableTapFallback('Microphone not supported — tap the cake to blow out the candles');
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function(stream){
        micActive = true;
        micStatus.classList.add('show');
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = 0.75;
        source.connect(analyser);
        dataArray = new Uint8Array(analyser.fftSize);
        listenForBlow();
      })
      .catch(function(){
        enableTapFallback('Mic access denied — tap the cake to blow out the candles');
      });
  }

  function enableTapFallback(message){
    tapCakeHint.textContent = message;
    tapCakeHint.classList.add('show');
    cakePage.style.cursor = 'pointer';
    cakePage.addEventListener('click', onCakeTap);
  }

  function onCakeTap(){
    if (extinguishing || candlesLit === 0) return;
    extinguishOne();
  }

  var blowHold = 0;
  function listenForBlow(){
    rafId = requestAnimationFrame(listenForBlow);
    if (!analyser || extinguishing && candlesLit === 0) return;
    analyser.getByteTimeDomainData(dataArray);
    var sum = 0;
    for (var i = 0; i < dataArray.length; i++){
      var v = (dataArray[i] - 128) / 128;
      sum += v * v;
    }
    var rms = Math.sqrt(sum / dataArray.length);

    if (rms > 0.16){
      blowHold++;
    } else {
      blowHold = Math.max(0, blowHold - 1);
    }

    if (blowHold > 4 && candlesLit > 0 && !extinguishing){
      blowHold = 0;
      extinguishOne();
    }
  }

  function extinguishOne(){
    if (candlesLit <= 0) return;
    extinguishing = true;
    var idx = candles.length - candlesLit;
    candles[idx].classList.add('out');
    candlesLit--;
    if (candlesLit === 0){
      cleanupMic();
      setTimeout(celebrate, 550);
    } else {
      setTimeout(function(){ extinguishing = false; }, 260);
    }
  }

  function cleanupMic(){
    if (rafId) cancelAnimationFrame(rafId);
    micStatus.classList.remove('show');
    tapCakeHint.classList.remove('show');
    cakePage.removeEventListener('click', onCakeTap);
    if (audioCtx && audioCtx.state !== 'closed'){
      try { audioCtx.close(); } catch(e){}
    }
  }

  function celebrate(){
    banner.classList.add('show');
    fireConfettiBurst();
  }

  function fireConfettiBurst(){
    var duration = 3200;
    var end = Date.now() + duration;
    var colors = ['#ff6b8b', '#ffd166', '#4dd4ac', '#5fa8ff', '#c98bff', '#ffffff'];

    myConfetti({
      particleCount: 140,
      spread: 100,
      origin: { y: 0.35 },
      colors: colors,
      startVelocity: 55,
      scalar: 1.1
    });

    (function frame(){
      myConfetti({
        particleCount: 6,
        angle: 60,
        spread: 65,
        origin: { x: 0, y: 0.55 },
        colors: colors
      });
      myConfetti({
        particleCount: 6,
        angle: 120,
        spread: 65,
        origin: { x: 1, y: 0.55 },
        colors: colors
      });
      if (Date.now() < end){
        requestAnimationFrame(frame);
      }
    })();

    setTimeout(function(){
      myConfetti({
        particleCount: 90,
        spread: 130,
        origin: { y: 0.25 },
        colors: colors,
        startVelocity: 45,
        scalar: 1
      });
    }, 500);
  }

})();
</script>

</body>
</html>
